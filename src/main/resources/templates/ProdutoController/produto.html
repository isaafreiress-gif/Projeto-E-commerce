<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Zion Tech Store | Produtos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="logo">Zion Tech Store</div>
  <div class="busca-container">
    <input type="text" id="input-busca" placeholder="O que você busca?">
    <button id="btn-busca">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
        <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
      </svg>
    </button>
  </div>
  <nav>
    <ul>
      <li><a href="/">Home</a></li>
      <li>Produtos</li>
      <li><a href="carrinho" class="link-carrinho">Carrinho (<span id="contador-carrinho">0</span>)</a></li>
      <li><a href="login">Login</a></li>
    </ul>
  </nav>
</header>

<section class="produtos-section">
  <h2 class="titulo-sessao">Produtos</h2>
  <div class="grid-produtos" id="grid-produtos">
    <p style="color: #a694c7; text-align: center; width: 100%;">Carregando produtos...</p>
  </div>
</section>

<script src="js/Script.js"></script>
<script src="js/carrinho.js"></script>
<script src="js/produto.js"></script>
</body>
</html>
