<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Zion Tech | Gerenciar Administradores</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Orbitron:wght@900&display=swap" rel="stylesheet">
  <script src="js/cadastroadm.js"></script>
</head>
<body class="Cadastroprodutos">

<div class="admin-container">
  <aside class="menu-lateral">
    <h2>Zion Admin</h2>
    <nav>
      <a href="paginaadm">📊 Dashboard</a>
      <a href="auditoria">👤 Auditoria</a>
      <a href="cadastroproduto">📦 Novo Produto</a>
      <a href="estoque">📋 Estoque</a>
      <a href="cadastroadm" class="active">👤 Cadastrar ADM</a>
      <a href="produto" style="margin-top: 40px; border: 1px solid #a100d5; display: block; text-align: center;">Voltar para Loja</a>
      <a href="#" onclick="logout()" style="color: #ff4d4d;">Sair</a>
    </nav>
  </aside>

  <main class="conteudo-principal">
    <h1>👤 Gerenciar Administradores</h1>

    <section class="secao-auditoria" style="margin-bottom: 40px;">
      <div class="auditoria-header">
        <h2>Adicionar Novo Administrador</h2>
      </div>

      <div class="form-card" style="max-width: 500px; margin-top: 20px;">
        <div class="campo">
          <label>Nome Completo</label>
          <input type="text" id="nome-adm" placeholder="Digite o nome" required>
        </div>

        <div class="campo">
          <label>E-mail</label>
          <input type="email" id="email-adm" placeholder="admin@email.com" required>
        </div>

        <div class="campo">
          <label>Senha</label>
          <input type="password" id="senha-adm" placeholder="••••••••" required>
        </div>

        <button type="button" class="btn-salvar" onclick="cadastrarAdmin()" style="margin-top: 16px;">
          + Cadastrar Administrador
        </button>
      </div>
    </section>

    <section class="secao-auditoria">
      <div class="auditoria-header">
        <h2>Administradores Cadastrados</h2>
        <button class="btn-salvar" onclick="carregarAdmins()" style="padding: 8px 16px; font-size: 0.85rem;">
          Atualizar Lista
        </button>
      </div>

      <div class="table-responsive" style="margin-top: 16px;">
        <table class="tabela-auditoria">
          <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Perfil</th>
            <th>Ações</th>
          </tr>
          </thead>
          <tbody id="tabela-admins-corpo">
          <tr>
            <td colspan="5" style="text-align: center; color: #a694c7;">Carregando...</td>
          </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>

</body>
</html>
