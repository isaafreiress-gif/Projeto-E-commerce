<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Zion Tech | Painel Administrativo</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Orbitron:wght@900&display=swap" rel="stylesheet">
  <script src="js/paginaadm.js"></script>
</head>
<body class="Cadastroprodutos">

<div class="admin-container">
  <aside class="menu-lateral">
    <h2>Zion Admin</h2>
    <nav>
      <a href="paginaadm" class="active">📊 Dashboard</a>
      <a href="auditoria">👤 Auditoria</a>
      <a href="cadastroproduto">📦 Novo Produto</a>
      <a href="estoque">📋 Estoque</a>
      <a href="cadastroadm">👤 Cadastrar ADM</a>
      <a href="produto" style="margin-top: 40px; border: 1px solid #a100d5; display: block; text-align: center;">Voltar para Loja</a>
      <a href="#" onclick="logout()" style="color: #ff4d4d;">Sair</a>
    </nav>
  </aside>

  <main class="conteudo-principal">
    <section id="stats">
      <div class="auditoria-header">
        <h1>Visão Geral</h1>
        <button class="btn-salvar" onclick="atualizarDados()">Atualizar Dados</button>
      </div>

      <div class="container-cards">
        <div class="card">
          <h3>Vendas Estimadas</h3>
          <p id="vendas-valor">R$ 0,00</p>
        </div>
        <div class="card">
          <h3>Total de Pedidos</h3>
          <p id="vendas-qtd">0</p>
        </div>
        <div class="card">
          <h3>Usuários Ativos</h3>
          <p id="usuarios-qtd">0</p>
        </div>
      </div>
    </section>
  </main>
</div>

</body>
</html>
